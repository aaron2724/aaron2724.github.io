<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR migration review | Aaron Wedick</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:#173a36;font:16px/1.5 system-ui}main{max-width:1160px;margin:auto;padding:4vw}header{border-top:5px solid #087567}h1{font:clamp(2.3rem,5vw,4.5rem)/1.05 Georgia;margin:.45em 0}p{max-width:78ch}nav,.filters,.cards{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button,select{font:inherit;color:inherit;background:white;border:1px solid #a8beb6;border-radius:5px;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{background:#124c46;color:white}.cards div{background:white;border-top:3px solid #187b6d;min-width:170px;padding:15px;flex:1}.cards strong{display:block;font-size:2rem}.scroll{overflow:auto;background:white}table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:10px;text-align:left;border-bottom:1px solid #dce5e1;white-space:pre}th{background:#dce9e4}label{display:grid}small{color:#496760}button:disabled{opacity:.4}</style><main><header><p>Aaron Wedick · Independent Power BI portfolio</p><h1>HR migration review</h1><p>Which employee records can progress to business sign-off? Explore 5,000 fictional records from intake through reconciliation. All values, rules and outcomes are synthetic.</p></header><nav id="tabs"></nav><section id="panel"></section></main><script>
const rows=[],diff=[],regions=['NSW','VIC','QLD','WA','NZ'],names=['Cost Centre','Salary Basis','Leave Group','FTE'];
for(let i=1;i<=5000;i++){let id='DEMO-'+String(i).padStart(4,'0'),region=regions[(i-1)%5],rawID=i===501?'DEMO-0500':i%41===0?' '+id.toLowerCase()+' ':id,rawRegion=i%73===0?'':i%67===0?'XX':i%43===0?' '+region.toLowerCase()+' ':region,cleanID=rawID.trim().toUpperCase(),cleanRegion=rawRegion.trim().toUpperCase(),fte=i%4===0?'0.8':'1.0',rawFTE=i%89===0?'unknown':fte,reason=[cleanID==='DEMO-0500'?'Duplicate ID':'',!cleanRegion?'Missing region':cleanRegion==='XX'?'Unknown region':'',rawFTE==='unknown'?'Invalid FTE':''].filter(Boolean).join(' / '),quality=reason?'Held':cleanID!==rawID||cleanRegion!==rawRegion?'Standardised':'Passed as received';
let vals=['CC'+(100+i%20),i%2===0?'Annual':'Hourly',i%3===0?'Group B':'Group A',fte],target=['CC900',i%2===0?'Hourly':'Annual','Group C','0.6'],m=0;[17,23,29,31].forEach((d,j)=>{if(i%d===0){m++;diff.push({id,region,field:names[j],legacy:vals[j],target:target[j],priority:[1,3].includes(j)?'High':'Review'})}});
rows.push({i,id,region,rawID,cleanID,rawRegion,cleanRegion,rawFTE,parsed:rawFTE==='unknown'?'':fte,reason,quality,m,gate:reason?'Resolve intake issue':m?'Investigate reconciliation':'Eligible for sign-off'})}
const labels=['Executive overview','Exception investigation','Data quality & transformation','Migration readiness'],notes=['Compare the legacy and target extracts across cost centre, salary basis, leave group and FTE. A single employee can have several differences.','Each row is one field difference. Salary basis and FTE receive high priority because they affect the interpretation of pay or working hours. A difference requires investigation before anyone changes a value.','The intake query preserves every raw row. Power Query trims spaces, standardises text case, parses FTE and checks region codes and duplicate IDs. An empty prepared value means the input could not be resolved. Both copies of a duplicate are held.','This illustrative gate combines intake quality with the reconciliation result. Resolve identity and data quality issues first, then investigate differences. Eligible means the record passed these checks and can go to a business owner for sign-off.'];
let tab=0,filters={},page=0;const panel=document.getElementById('panel'),tabs=document.getElementById('tabs');function render(){tabs.innerHTML=labels.map((s,i)=>'<button aria-pressed="'+(i===tab)+'" onclick="change('+i+')">'+s+'</button>').join('');let data=tab===1?diff:rows,keys=[['region'],['region','field','priority'],['quality'],['gate']][tab],pick=data.filter(r=>keys.every(k=>!filters[k]||filters[k]===r[k])),kpis,cols,list;const count=(k,v)=>pick.filter(r=>r[k]===v).length;
if(tab===0){let matched=count('m',0);kpis=[['Records',pick.length],['Fully matched',matched],['With exceptions',pick.length-matched],['Match rate',(100*matched/(pick.length||1)).toFixed(2)+'%']];cols=['Field','Differences'];list=names.map(n=>[n,diff.filter(r=>r.field===n&&(!filters.region||r.region===filters.region)).length])}
if(tab===1){kpis=[['Discrepancies',pick.length],['Affected employees',new Set(pick.map(r=>r.id)).size],['High priority',count('priority','High')]];cols=['Employee ID','Region','Field','Legacy','Target','Priority'];list=pick.map(r=>[r.id,r.region,r.field,r.legacy,r.target,r.priority])}
if(tab===2){kpis=[['Intake rows',pick.length],['Standardised',count('quality','Standardised')],['Held',count('quality','Held')]];cols=['Row','Raw ID','Prepared ID','Raw region','Prepared region','Raw FTE','Parsed FTE','Quality','Reason'];list=pick.map(r=>[r.i,JSON.stringify(r.rawID),r.cleanID,JSON.stringify(r.rawRegion),r.cleanRegion,r.rawFTE,r.parsed,r.quality,r.reason])}
if(tab===3){kpis=['Resolve intake issue','Investigate reconciliation','Eligible for sign-off'].map(k=>[k,count('gate',k)]);cols=['Row','Prepared ID','Quality','Issue','Decision'];list=pick.map(r=>[r.i,r.cleanID,r.quality,r.reason,r.gate])}
panel.innerHTML='<h2>'+labels[tab]+'</h2><p>'+notes[tab]+'</p><div class="filters">'+keys.map(k=>'<label>'+({gate:'Decision',region:'Region',priority:'Priority',quality:'Quality',field:'Field'})[k]+'<select data-key="'+k+'"><option value="">All</option>'+[...new Set(data.map(r=>r[k]))].sort().map(v=>'<option '+(filters[k]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div><div class="cards">'+kpis.map(([k,v])=>'<div><strong>'+v.toLocaleString()+'</strong>'+k+'</div>').join('')+'</div><div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+list.slice(page*25,page*25+25).map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p>'+list.length.toLocaleString()+' rows · Page '+(page+1)+' of '+Math.max(1,Math.ceil(list.length/25))+'</p><button id="prev">Previous</button> <button id="next">Next</button>';panel.querySelectorAll('select').forEach(el=>el.onchange=()=>{filters[el.dataset.key]=el.value;page=0;render()});for(let [key,step,disabled] of [['prev',-1,page===0],['next',1,(page+1)*25>=list.length]]){let el=document.getElementById(key);el.disabled=disabled;el.onclick=()=>{page+=step;render()}}}
function change(i){tab=i;filters={};page=0;render()}render();</script></html>
